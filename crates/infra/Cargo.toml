[package]
name = "infra"
edition.workspace = true
version.workspace = true

[dependencies]
datagrid_query = { path = "../../../datagrid-query-builder/datagrid-query-rs" }
models = { path = "../models" }
serde = "1"
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "bigdecimal",
    "chrono",
    "json",
    "postgres",
    "runtime-tokio",
    "tls-none",
    "uuid",
] }